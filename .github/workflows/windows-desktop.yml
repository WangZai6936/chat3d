name: Windows desktop installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:team
      - run: npm run build
  build-windows:
    needs: regression
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install stable Rust with Windows x64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install JavaScript dependencies
        run: npm ci
      # Signing secrets are optional. All three of TAURI_SIGNING_PRIVATE_KEY,
      # CHAT3D_UPDATER_PUBKEY and CHAT3D_UPDATER_ENDPOINT switch this job to a
      # signed build and a static Tauri latest.json. A partial set fails the job.
      # Portal manifest: https://portal.jiezi-ai.com/desktop-updates/chat3d/latest.json
      # Upload chat3d/ to /opt/1panel/www/sites/portal.jiezi-ai.com/index/desktop-updates/chat3d/
      # Packages live in desktop-updates/chat3d/windows/, desktop-updates/chat3d/mac/ and desktop-updates/chat3d/linux/.
      # This workflow only builds Windows. Do not publish empty macOS or Linux entries.
      - name: Decide updater signing
        id: updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CHAT3D_UPDATER_PUBKEY: ${{ secrets.CHAT3D_UPDATER_PUBKEY }}
          CHAT3D_UPDATER_ENDPOINT: ${{ secrets.CHAT3D_UPDATER_ENDPOINT }}
        run: node scripts/updater-release-mode.mjs
      - name: Build unsigned Windows x64 NSIS installer
        if: success() && steps.updater.outputs.mode == 'unsigned'
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows.conf.json -- --locked
      - name: Build signed Windows x64 NSIS installer
        if: success() && steps.updater.outputs.mode == 'signed'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CHAT3D_UPDATER_PUBKEY: ${{ secrets.CHAT3D_UPDATER_PUBKEY }}
          CHAT3D_UPDATER_ENDPOINT: ${{ secrets.CHAT3D_UPDATER_ENDPOINT }}
          CHAT3D_UPDATE_NOTES: ${{ vars.CHAT3D_UPDATE_NOTES }}
          CHAT3D_UPDATE_PUB_DATE: ${{ vars.CHAT3D_UPDATE_PUB_DATE }}
        run: npm run tauri:build:windows
      - name: Confirm generated updater config has no private key
        if: success() && steps.updater.outputs.mode == 'signed'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CHAT3D_UPDATER_ENDPOINT: ${{ secrets.CHAT3D_UPDATER_ENDPOINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $text = Get-Content src-tauri/updater.generated.json -Raw
          if ($text -notmatch 'createUpdaterArtifacts') { throw 'Updater config is missing createUpdaterArtifacts.' }
          if ($text.Contains('TAURI_SIGNING_PRIVATE_KEY')) { throw 'Updater config names the private key variable.' }
          if ($env:TAURI_SIGNING_PRIVATE_KEY -and $text.Contains($env:TAURI_SIGNING_PRIVATE_KEY.Trim())) { throw 'Updater config contains the private key.' }
          if (-not $text.Contains($env:CHAT3D_UPDATER_ENDPOINT.Trim())) { throw 'Updater config is missing the endpoint.' }
      - name: Check installer and record hashes and source commit
        shell: pwsh
        env:
          UPDATER_MODE: ${{ steps.updater.outputs.mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Test-Path 'dist/server') -or (Test-Path 'dist/_worker.js')) { throw 'Desktop frontend unexpectedly contains the Sites worker.' }
          $installers = @(Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -ne '0.2.1' -or $tauriVersion -ne $version) { throw 'Expected consistent 0.2.1 versions.' }
          if ($installers[0].Name -cne "Scenivo_${version}_x64-setup.exe") { throw 'Unexpected installer version or architecture.' }
          New-Item -ItemType Directory -Path 'windows-artifact' -Force | Out-Null
          $hashes = foreach ($installer in $installers) {
            if ($installer.Length -eq 0) { throw "Empty installer: $($installer.Name)" }
            $stream = [System.IO.File]::OpenRead($installer.FullName)
            try {
              if ($stream.ReadByte() -ne 0x4D -or $stream.ReadByte() -ne 0x5A) { throw "Invalid executable: $($installer.Name)" }
            } finally { $stream.Dispose() }
            Copy-Item $installer.FullName 'windows-artifact/'
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)"
          }
          $hashes | Set-Content 'windows-artifact/SHA256SUMS.txt' -Encoding utf8
          $package = if ($env:UPDATER_MODE -eq 'signed') {
            'signed NSIS installer; updater manifest is in the chat3d-desktop-update artifact; user GPU not verified'
          } else {
            'unsigned NSIS installer; see the dependent installed-app job for installation evidence; user GPU not verified'
          }
          @(
            "repository=$env:GITHUB_REPOSITORY"
            "commit=$env:GITHUB_SHA"
            "run=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "version=$version"
            "build_run_id=$env:GITHUB_RUN_ID"
            'target=x86_64-pc-windows-msvc'
            "package=$package"
          ) | Set-Content 'windows-artifact/SOURCE-COMMIT.txt' -Encoding utf8
      - name: Upload installer and provenance
        uses: actions/upload-artifact@v4
        with:
          name: chat3d-windows-x64-${{ github.sha }}
          path: windows-artifact/*
          if-no-files-found: error
          retention-days: 30
      - name: Assemble Tauri latest.json
        if: success() && steps.updater.outputs.mode == 'signed'
        env:
          CHAT3D_UPDATER_ENDPOINT: ${{ secrets.CHAT3D_UPDATER_ENDPOINT }}
          CHAT3D_UPDATE_NOTES: ${{ vars.CHAT3D_UPDATE_NOTES }}
          CHAT3D_UPDATE_PUB_DATE: ${{ vars.CHAT3D_UPDATE_PUB_DATE }}
        run: npm run desktop-update:assemble -- --bundle src-tauri/target/x86_64-pc-windows-msvc/release/bundle --out desktop-update-publish
      - name: Upload updater manifest and packages
        if: success() && steps.updater.outputs.mode == 'signed'
        uses: actions/upload-artifact@v4
        with:
          name: chat3d-desktop-update-${{ github.sha }}
          path: desktop-update-publish/**
          if-no-files-found: error
          retention-days: 30

  installed-app:
    needs: build-windows
    uses: ./.github/workflows/windows-smoke.yml
    permissions:
      contents: read
