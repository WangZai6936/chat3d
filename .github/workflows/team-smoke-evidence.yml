name: Inspect isolated team smoke evidence
on:
  push:
    branches: [diagnostics/team-smoke-evidence]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: WangZai6936/chat3d
          run-id: 37880669235
          name: windows-installed-smoke-525e392bc8fbd45b1e9229d7648c9a944193fb39
          path: evidence
      - name: Print synthetic test diagnostics and screenshot
        run: |
          python3 - <<'PY'
          import pathlib,base64
          root=pathlib.Path('evidence')
          for name in ['ui-result.json','ui-failure-controls.json','team-server.log','team-server-error.log','installation.json']:
              print('\nFILE '+name+'\n'+(root/name).read_text(encoding='utf-8-sig'))
          print('SCREENSHOT_BASE64_START')
          print(base64.b64encode((root/'ui-failure.png').read_bytes()).decode())
          print('SCREENSHOT_BASE64_END')
          PY
