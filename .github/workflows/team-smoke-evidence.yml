name: Inspect isolated team smoke evidence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: WangZai6936/chat3d
          run-id: 37882179103
          name: windows-installed-smoke-d48d7bda8da8330e37a3f5035d0eafb79b5a3431
          path: evidence
      - name: Print synthetic test diagnostics and screenshot
        run: |
          python3 - <<'PY'
          import pathlib,base64
          root=pathlib.Path('evidence')
          for name in ['ui-result.json','ui-failure-controls.json','team-server.log','team-server-error.log','installation.json']:
              if (root/name).exists(): print('\nFILE '+name+'\n'+(root/name).read_text(encoding='utf-8-sig'))
          print('SCREENSHOT_BASE64_START')
          picture = root/('ui-failure.png' if (root/'ui-failure.png').exists() else 'ui-team-local-copy.png')
          print(base64.b64encode(picture.read_bytes()).decode())
          print('SCREENSHOT_BASE64_END')
          PY
