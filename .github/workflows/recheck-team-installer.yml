name: Verify existing 0.2.0 installer with live fixture
on:
  push:
    branches: [diagnostics/team-smoke-evidence]
    paths: [.github/workflows/recheck-team-installer.yml, tests/windows-ui-smoke.ps1, tests/team-smoke-server.mjs]
permissions:
  contents: read
  actions: read
jobs:
  installed-app:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d48d7bda8da8330e37a3f5035d0eafb79b5a3431
      - uses: actions/checkout@v4
        with:
          path: verification-harness
      - name: Use the versioned verification harness without changing the installed binary
        shell: pwsh
        run: |
          Copy-Item verification-harness/tests/windows-ui-smoke.ps1 tests/windows-ui-smoke.ps1 -Force
          Copy-Item verification-harness/tests/team-smoke-server.mjs tests/team-smoke-server.mjs -Force
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: chat3d-windows-x64-d48d7bda8da8330e37a3f5035d0eafb79b5a3431
          github-token: ${{ github.token }}
          run-id: 37882179103
          repository: WangZai6936/chat3d
          path: installer-artifact
      - name: Verify and install the built installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item windows-smoke-results -ItemType Directory -Force | Out-Null
          $source = Get-Content installer-artifact/SOURCE-COMMIT.txt -Raw | ConvertFrom-StringData
          $checkedOut = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkedOut -cne 'd48d7bda8da8330e37a3f5035d0eafb79b5a3431') { throw 'Test checkout does not match the workflow commit.' }
          if ($source.repository -cne $env:GITHUB_REPOSITORY -or $source.commit -cne $checkedOut) { throw 'Installer source commit or repository mismatch.' }
          if ($source.build_run_id -ne '37882179103') { throw 'Installer belongs to another workflow run.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne '0.2.0' -or $source.version -ne $version) { throw 'Expected the 0.2.0 installer.' }
          if ($source.target -ne 'x86_64-pc-windows-msvc') { throw 'Installer target mismatch.' }
          $installers = @(Get-ChildItem installer-artifact -Filter '*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer.' }
          $exe = $installers[0]
          if ($exe.Name -cne "Chat3D_${version}_x64-setup.exe") { throw 'Installer filename does not match the required version.' }
          $hashLines = @(Get-Content installer-artifact/SHA256SUMS.txt | Where-Object { $_.Trim() })
          if ($hashLines.Count -ne 1 -or $hashLines[0] -cnotmatch '^([a-f0-9]{64})  (.+)$') { throw 'Invalid installer hash manifest.' }
          $expected = $Matches[1]
          if ($Matches[2] -cne $exe.Name) { throw 'Hash manifest names a different installer.' }
          $actual = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw 'Installer hash mismatch' }
          Copy-Item installer-artifact/SOURCE-COMMIT.txt,installer-artifact/SHA256SUMS.txt windows-smoke-results/
          $destination = Join-Path $env:RUNNER_TEMP 'Chat3D-Smoke'
          $p = Start-Process $exe.FullName -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exit $($p.ExitCode)" }
          $app = Get-ChildItem $destination -Recurse -Filter '*.exe' | Where-Object { $_.Name -ieq 'chat3d.exe' } | Select-Object -First 1
          if (!$app) { throw 'Installed executable missing' }
          $installedVersion = $app.VersionInfo.ProductVersion
          if ($installedVersion -notmatch '^0\.2\.0(?:\.0)?$') { throw "Installed executable version mismatch: $installedVersion" }
          @{ repository=$env:GITHUB_REPOSITORY; commit=$checkedOut; buildRun=$source.build_run_id; verificationRun=$env:GITHUB_RUN_ID; version=$version; installer=$exe.Name; installerSha256=$actual; installExitCode=$p.ExitCode; installedVersion=$installedVersion; installedExeSha256=(Get-FileHash $app.FullName -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json | Set-Content windows-smoke-results/installation.json
          "CHAT3D_INSTALLED_EXE=$($app.FullName)" >> $env:GITHUB_ENV
      - name: Install locked JavaScript test dependencies
        run: npm ci --ignore-scripts
      - name: Record native startup and driver versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item windows-smoke-results -ItemType Directory -Force | Out-Null
          Get-Command msedgedriver -ErrorAction SilentlyContinue | Select-Object Source | Out-String | Set-Content windows-smoke-results/edge-driver-path.txt
          Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe" -ErrorAction SilentlyContinue | ForEach-Object { $_.VersionInfo.FileVersion } | Set-Content windows-smoke-results/webview-versions.txt
          $app = Start-Process $env:CHAT3D_INSTALLED_EXE -PassThru
          Start-Sleep -Seconds 12
          $app.Refresh()
          @{ exited=$app.HasExited; pid=$app.Id; title=$app.MainWindowTitle; window=$app.MainWindowHandle.ToInt64() } | ConvertTo-Json | Set-Content windows-smoke-results/native-startup.json
          try {
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $rect = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap($rect.Width, $rect.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($rect.Location, [System.Drawing.Point]::Empty, $rect.Size)
            $bitmap.Save("$PWD/windows-smoke-results/native-desktop.png")
            $graphics.Dispose(); $bitmap.Dispose()
          } catch { $_ | Out-String | Set-Content windows-smoke-results/screenshot-error.txt }
          if (!$app.HasExited) { $app.CloseMainWindow() | Out-Null; Start-Sleep -Seconds 3; if (!$app.HasExited) { $app.Kill() } }
      - name: Exercise installed app with a live isolated team service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build:team
          if ($LASTEXITCODE -ne 0) { throw 'Team validator build failed' }
          Get-NetTCPConnection -LocalPort 80 -ErrorAction SilentlyContinue | Format-List *
          netsh http show servicestate
          netsh interface ipv4 show excludedportrange protocol=tcp
          Get-Service W3SVC,WAS -ErrorAction SilentlyContinue | Format-List Name,Status
          $env:CHAT3D_TEAM_SMOKE_PORT = '80'
          $env:CHAT3D_TEAM_SMOKE_URL = 'http://127.0.0.1'
          $env:CHAT3D_TEAM_SMOKE_DIR = Join-Path $env:RUNNER_TEMP ('chat3d-team-' + [guid]::NewGuid())
          New-Item $env:CHAT3D_TEAM_SMOKE_DIR -ItemType Directory -Force | Out-Null
          $fixture = Start-Process node -ArgumentList 'tests/team-smoke-server.mjs' -NoNewWindow -PassThru -RedirectStandardOutput 'windows-smoke-results/team-server.log' -RedirectStandardError 'windows-smoke-results/team-server-error.log'
          "CHAT3D_TEAM_SMOKE_PID=$($fixture.Id)" >> $env:GITHUB_ENV
          Start-Sleep -Seconds 3
          $fixture.Refresh()
          if ($fixture.HasExited) { Get-Content windows-smoke-results/team-server-error.log; throw 'Team fixture failed to start' }
          try {
            & ./tests/windows-ui-smoke.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Installed UI smoke failed' }
          } finally {
            Stop-Process -Id $fixture.Id -ErrorAction SilentlyContinue
          }
      - name: Stop isolated team sharing fixture
        if: always()
        shell: pwsh
        run: |
          if ($env:CHAT3D_TEAM_SMOKE_PID) { Stop-Process -Id $env:CHAT3D_TEAM_SMOKE_PID -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installed-recheck-d48d7bd-${{ github.run_id }}
          path: windows-smoke-results/*
          if-no-files-found: warn
          retention-days: 14
