name: Windows installed app smoke test
on:
  push:
    branches: [main]
    paths:
      - tests/windows-native-smoke.mjs
      - tests/windows-ui-smoke.ps1
      - .github/workflows/windows-smoke.yml
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful installer workflow run ID
        required: true
        default: '37649044070'
permissions:
  contents: read
  actions: read
jobs:
  installed-app:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run || '37649044070' }}
          path: installer-artifact
          merge-multiple: true
      - name: Verify and install the built installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem installer-artifact -Filter '*setup.exe' | Select-Object -First 1
          if (!$exe) { throw 'Installer missing' }
          $expected = (Get-Content installer-artifact/SHA256SUMS.txt).Split(' ')[0].Trim()
          if ((Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Installer hash mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'Chat3D-Smoke'
          $p = Start-Process $exe.FullName -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exit $($p.ExitCode)" }
          $app = Get-ChildItem $destination -Recurse -Filter '*.exe' | Where-Object { $_.Name -ieq 'chat3d.exe' } | Select-Object -First 1
          if (!$app) { throw 'Installed executable missing' }
          "CHAT3D_INSTALLED_EXE=$($app.FullName)" >> $env:GITHUB_ENV
      - name: Install locked JavaScript test dependencies
        run: npm ci --ignore-scripts
      - name: Record native startup and driver versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item windows-smoke-results -ItemType Directory -Force | Out-Null
          Get-Command msedgedriver -ErrorAction SilentlyContinue | Select-Object Source | Out-String | Set-Content windows-smoke-results/edge-driver-path.txt
          Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe" -ErrorAction SilentlyContinue | ForEach-Object { $_.VersionInfo.FileVersion } | Set-Content windows-smoke-results/webview-versions.txt
          $app = Start-Process $env:CHAT3D_INSTALLED_EXE -PassThru
          Start-Sleep -Seconds 12
          $app.Refresh()
          @{ exited=$app.HasExited; pid=$app.Id; title=$app.MainWindowTitle; window=$app.MainWindowHandle.ToInt64() } | ConvertTo-Json | Set-Content windows-smoke-results/native-startup.json
          try {
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $rect = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap($rect.Width, $rect.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($rect.Location, [System.Drawing.Point]::Empty, $rect.Size)
            $bitmap.Save("$PWD/windows-smoke-results/native-desktop.png")
            $graphics.Dispose(); $bitmap.Dispose()
          } catch { $_ | Out-String | Set-Content windows-smoke-results/screenshot-error.txt }
          if (!$app.HasExited) { $app.CloseMainWindow() | Out-Null; Start-Sleep -Seconds 3; if (!$app.HasExited) { $app.Kill() } }
      - name: Exercise installed app through Windows accessibility and real clicks
        shell: pwsh
        run: ./tests/windows-ui-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installed-smoke-${{ github.sha }}
          path: windows-smoke-results/*
          if-no-files-found: warn
          retention-days: 14
