<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/chat3d.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat3D</title>
    <script>try{const mode=localStorage.getItem('chat3d.appearance.v1');const dark=mode==='dark'||(mode==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.appearance=dark?'dark':'light';document.documentElement.style.colorScheme=dark?'dark':'light';}catch{document.documentElement.dataset.appearance='light';}</script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
